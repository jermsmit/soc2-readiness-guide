title: SOC 2 Readiness Guide for Life Sciences
description: A practical, field-tested guide to SOC 2 readiness for life sciences companies, covering the standard Trust Services Criteria and the GxP, 21 CFR Part 11, and HIPAA overlap.
theme: jekyll-theme-cayman
markdown: kramdown
show_downloads: true

# jekyll-seo-tag (already bundled with GitHub Pages) reads the "image" value
# below to set the og:image and twitter:image meta tags, which is what
# LinkedIn, Twitter/X, and Slack pull when generating a link preview card.
# Setting it via a site-wide front matter default applies it to every page,
# so no per-page image needs to be set.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/og-image.png

twitter:
  card: summary_large_image

# Once you have a custom domain, create a file named CNAME at the repo root
# containing only your domain, for example: guide.yourdomain.com
# Then set that domain in your DNS and in the GitHub Pages settings for this repo.

# To enable Pages: repo Settings > Pages > Build and deployment > Deploy from a branch
# Branch: main, folder: / (root)
